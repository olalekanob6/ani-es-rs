[package]
name = "ani-es-rs"
version = "0.1.0"
edition = "2021"
description = "CLI para ver anime en español desde la terminal (Rust port de ani-es)"
authors = ["olal3"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "cookies", "native-tls"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
thiserror = "1"
which = "6"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
atty = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
